<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Football 276</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}

body{
    background:#020617;
    color:white;
    overflow:hidden;
    padding-bottom:120px;
}

/* ===== LOADING ===== */

#loading{
    position:fixed;
    inset:0;
    background:#020617;

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    z-index:9999;
}

/* الدوائر */
.loader{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.loader div{
    width:18px;
    height:18px;
    border-radius:50%;
    background:#22c55e;
    animation:bounce 0.6s infinite alternate;
}

.loader div:nth-child(2){
    animation-delay:0.2s;
}

.loader div:nth-child(3){
    animation-delay:0.4s;
}

/* النص */
.text{
    font-size:20px;
    letter-spacing:3px;
    color:#cbd5e1;
}

/* ===== CONTENT ===== */

#content{
    display:none;
    padding:20px;
}

/* العنوان */
.main-title{
    text-align:center;
    margin-bottom:40px;
}

/* ===== COUNTDOWN ===== */

.countdown{
    display:flex;
    gap:15px;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:40px;
}

.box{
    background:#0f172a;
    padding:20px;
    border-radius:15px;
    min-width:100px;
    text-align:center;
}

.number{
    font-size:35px;
    font-weight:bold;
    color:#22c55e;
}

.label{
    margin-top:8px;
    color:#cbd5e1;
}

/* ===== TEAMS ===== */

.team{
    background:#0f172a;
    padding:15px;
    margin-bottom:15px;
    border-radius:15px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    box-shadow:0 0 10px rgba(0,0,0,0.4);
}

button{
    background:#22c55e;
    border:none;
    padding:10px 18px;
    border-radius:10px;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    opacity:0.8;
}

.votes{
    color:#22c55e;
    font-size:18px;
    font-weight:bold;
}

/* ===== LOWER BAR ===== */

.lower-bar{
    position:fixed;
    bottom:15px;
    left:50%;
    transform:translateX(-50%);

    width:90%;
    max-width:500px;

    background:rgba(15,23,42,0.9);
    backdrop-filter:blur(10px);

    border:1px solid rgba(255,255,255,0.1);
    border-radius:25px;

    padding:15px 10px;

    display:flex;
    justify-content:space-around;
    align-items:center;
}

.nav-btn{
    color:#cbd5e1;
    text-decoration:none;

    display:flex;
    flex-direction:column;
    align-items:center;

    gap:5px;
    font-size:14px;
    transition:0.3s;
}

.nav-btn i{
    font-size:22px;
}

.nav-btn:hover{
    color:#22c55e;
    transform:translateY(-5px);
}

.active{
    color:#22c55e;
}

/* animation */
@keyframes bounce{

    from{
        transform:translateY(0);
        opacity:0.5;
    }

    to{
        transform:translateY(-15px);
        opacity:1;
    }

}

</style>
</head>

<body>

<!-- LOADING -->
<div id="loading">

    <div class="loader">
        <div></div>
        <div></div>
        <div></div>
    </div>

    <div class="text"> Wait to open ...</div>

</div>

<!-- CONTENT -->
<div id="content">

    <h1 class="main-title">
        ⚽ Football 276 World Cup Vote
    </h1>

    <!-- COUNTDOWN -->

    <div class="countdown">

        <div class="box">
            <div class="number" id="days">0</div>
            <div class="label">Days</div>
        </div>

        <div class="box">
            <div class="number" id="hours">0</div>
            <div class="label">Hours</div>
        </div>

        <div class="box">
            <div class="number" id="minutes">0</div>
            <div class="label">Minutes</div>
        </div>

        <div class="box">
            <div class="number" id="seconds">0</div>
            <div class="label">Seconds</div>
        </div>

    </div>

    <!-- TEAMS -->

    <div id="teamsContainer"></div>

</div>

<!-- LOWER BAR -->

<div class="lower-bar">

    <a href="home.html" class="nav-btn active">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
    </a>

    <a href="news.html" class="nav-btn">
        <i class="fa-solid fa-futbol"></i>
        <span>News</span>
    </a>

    <a href="transferes.html" class="nav-btn">
        <i class="fa-solid fa-trophy"></i>
        <span>Transfers</span>
    </a>

</div>

<script>

/* ===== LOADING ===== */

setTimeout(()=>{

    document.getElementById("loading").style.display = "none";

    document.getElementById("content").style.display = "block";

    document.body.style.overflow = "auto";

},3000);

/* ===== COUNTDOWN ===== */

const worldCupDate = new Date("Jun 11, 2026 00:00:00").getTime();

setInterval(()=>{

    const now = new Date().getTime();

    const distance = worldCupDate - now;

    const days = Math.floor(distance / (1000*60*60*24));

    const hours = Math.floor(
        (distance % (1000*60*60*24))
        / (1000*60*60)
    );

    const minutes = Math.floor(
        (distance % (1000*60*60))
        / (1000*60)
    );

    const seconds = Math.floor(
        (distance % (1000*60))
        / 1000
    );

    document.getElementById("days").innerHTML = days;
    document.getElementById("hours").innerHTML = hours;
    document.getElementById("minutes").innerHTML = minutes;
    document.getElementById("seconds").innerHTML = seconds;

},1000);

/* ===== TEAMS ===== */

const teams = [

["🇦🇷 Argentina","argentina"],
["🇧🇷 Brazil","brazil"],
["🇪🇬 Egypt","egypt"],
["🇯🇴 Jordan","jordan"],
["🇮🇶 Iraq","iraq"],
["🇸🇦 Saudi Arabia","saudi"],
["🇲🇦 Morocco","morocco"],
["🇩🇿 Algeria","algeria"],
["🇹🇳 Tunisia","tunisia"],
["🇶🇦 Qatar","qatar"],
["🇫🇷 France","france"],
["🇩🇪 Germany","germany"],
["🇪🇸 Spain","spain"],
["🇵🇹 Portugal","portugal"],
["🏴 England","england"],
["🇮🇹 Italy","italy"],
["🇳🇱 Netherlands","netherlands"],
["🇧🇪 Belgium","belgium"]

];

const container = document.getElementById("teamsContainer");

teams.forEach(team=>{

    let name = team[0];
    let id = team[1];

    if(localStorage.getItem(id) == null){
        localStorage.setItem(id,0);
    }

    container.innerHTML += `

    <div class="team">

        <h2>${name}</h2>

        <div>

            <span class="votes" id="${id}Votes">
                ${localStorage.getItem(id)}
            </span>

            <button onclick="vote('${id}')">
                Vote
            </button>

        </div>

    </div>

    `;

});

/* التصويت */

function vote(team){

    let voted = localStorage.getItem("voted");

    if(voted){

        alert("You already voted!");
        return;

    }

    let currentVotes =
    Number(localStorage.getItem(team));

    currentVotes++;

    localStorage.setItem(team,currentVotes);

    document.getElementById(team+"Votes")
    .innerHTML = currentVotes;

    localStorage.setItem("voted","true");

    alert("Vote submitted!");

}

</script>

</body>
</html>
<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getDatabase,
ref,
set,
onValue,
get,
update
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {

apiKey: "حط apiKey هنا",

authDomain: "اسم المشروع.firebaseapp.com",

databaseURL: "https://اسم المشروع-default-rtdb.firebaseio.com",

projectId: "اسم المشروع",

storageBucket: "اسم المشروع.appspot.com",

messagingSenderId: "123456",

appId: "123456"

};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);

</script>

<button class="open-poll-btn" onclick="openPoll()">
🔥 تصويت كأس العالم
</button>

<div class="poll-popup" id="pollPopup">

<div class="poll-box">

<h2>
⚽ انزل مباريات كأس العالم من أول نصف النهائي ؟
</h2>

<div class="poll-buttons">

<button class="yes-btn" onclick="vote('yes')">
👍 اه
</button>

<button class="no-btn" onclick="vote('no')">
👎 لا
</button>

</div>

<div class="results">

<div class="result-item">
<span>اه :</span>
<span id="yesCount">0</span>
</div>

<div class="result-item">
<span>لا :</span>
<span id="noCount">0</span>
</div>

</div>

<button class="close-btn" onclick="closePoll()">
✖ اغلاق
</button>

</div>
</div>

<style>

body{
background:#020617;
font-family:Arial;
}

.open-poll-btn{
padding:14px 24px;
background:#22c55e;
border:none;
border-radius:14px;
color:white;
font-size:18px;
cursor:pointer;
font-weight:bold;
}

.poll-popup{
position:fixed;
inset:0;
background:rgba(0,0,0,.7);
display:none;
justify-content:center;
align-items:center;
z-index:999;
}

.poll-box{
width:90%;
max-width:420px;
background:#0f172a;
padding:30px;
border-radius:24px;
color:white;
text-align:center;
}

.poll-buttons{
display:flex;
gap:15px;
margin:25px 0;
}

.poll-buttons button{
flex:1;
padding:15px;
border:none;
border-radius:14px;
font-size:18px;
cursor:pointer;
font-weight:bold;
}

.yes-btn{
background:#22c55e;
color:white;
}

.no-btn{
background:#ef4444;
color:white;
}

.results{
background:#111827;
padding:15px;
border-radius:16px;
margin-bottom:20px;
}

.result-item{
display:flex;
justify-content:space-between;
margin:10px 0;
font-size:18px;
}

.close-btn{

</style>

<script type="module">

window.openPoll = function(){
document.getElementById("pollPopup").style.display="flex";
}

window.closePoll = function(){
document.getElementById("pollPopup").style.display="none";
}

const votesRef = ref(db, "worldcupPoll");

onValue(votesRef, (snapshot)=>{

const data = snapshot.val() || {
yes:0,
no:0
};

document.getElementById("yesCount").innerText = data.yes;
document.getElementById("noCount").innerText = data.no;

});

window.vote = async function(type){

if(localStorage.getItem("voted")){
alert("❌ انت صوت بالفعل");
return;
}

const snapshot = await get(votesRef);

let data = snapshot.val() || {
yes:0,
no:0
};

if(type === "yes"){
data.yes++;
}else{
data.no++;
}

await update(votesRef,data);

localStorage.setItem("voted","true");

alert("✅ تم تسجيل صوتك");

}

</script>
